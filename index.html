<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Errand Boys – Tell us what you need done</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F5F1;--ink:#16224A;--blue:#385495;--sun:#CE373E;--mint:#2D9445;--card:#fff;--mut:#5d6080;--line:#e3e2dc;--lb:transparent;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1530;--ink:#f3f2ee;--card:#16224a;--mut:#a5a8d0;--line:#2a3a70;--lb:#fff}}
:root[data-theme="dark"]{--bg:#0d1530;--ink:#f3f2ee;--card:#16224a;--mut:#a5a8d0;--line:#2a3a70;--lb:#fff}
*{box-sizing:border-box;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Georgia,sans-serif;line-height:1.05;letter-spacing:-.02em}
h1{font-size:clamp(2.6rem,7vw,5rem);font-weight:800}h2{font-size:clamp(1.9rem,4vw,2.9rem);font-weight:800}h3{font-size:1.25rem;font-weight:600}
a{color:inherit}.wrap{max-width:1120px;margin:auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;gap:6px;height:66px}
.logo{font:800 1.4rem 'Bricolage Grotesque';text-decoration:none;margin-right:auto}.logo{display:flex;align-items:center;gap:10px}.logo img{height:40px;width:auto;background:var(--lb);border-radius:10px;padding:2px 4px}.logo i{color:var(--blue);font-style:normal}
nav a.l{padding:8px 12px;border-radius:99px;text-decoration:none;font-weight:500;font-size:.95rem}
nav a.l:hover,nav a.on{background:var(--ink);color:var(--bg)}
.btn{display:inline-block;border:0;cursor:pointer;background:var(--blue);color:#fff;font:700 1rem Figtree;padding:14px 26px;border-radius:99px;text-decoration:none}
.btn.sun{background:var(--sun);color:#fff}.btn.out{background:none;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn:hover{filter:brightness(1.1)}:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.cartb{position:relative}.cartb b{position:absolute;top:-4px;right:-2px;background:var(--sun);color:#fff;border-radius:99px;font-size:.7rem;padding:0 6px}
section{padding:72px 0}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:64px 0}
.hero p{font-size:1.15rem;color:var(--mut);margin:20px 0 28px;max-width:46ch}.row{display:flex;gap:12px;flex-wrap:wrap}
.live{background:var(--blue);color:#fff;border-radius:28px;padding:24px;box-shadow:10px 10px 0 var(--sun)}
.live small{opacity:.8}.map{height:170px;margin:14px 0;border-radius:18px;background:#2a407f;position:relative;overflow:hidden}
.map svg{position:absolute;inset:0;width:100%;height:100%}.rider{position:absolute;font-size:1.6rem;offset-path:path('M20 130 C90 130 90 40 160 70 S260 30 300 40');animation:go 7s linear infinite}
@keyframes go{from{offset-distance:0}to{offset-distance:100%}}@media(prefers-reduced-motion:reduce){.rider{animation:none;offset-distance:60%}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;margin-top:32px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:10px}
.card .ic{font-size:2rem}.card p{color:var(--mut);font-size:.95rem;flex:1}.price{font:800 1.3rem 'Bricolage Grotesque'}
.band{background:var(--ink);color:var(--bg)}.band .card{background:#ffffff14;border-color:#ffffff22;color:#f3f2ee}.band .card p{color:#c9cbe8}
.stats{display:flex;gap:40px;flex-wrap:wrap}.stats div b{display:block;font:800 2.4rem 'Bricolage Grotesque';color:var(--sun)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
input,textarea,select{width:100%;padding:13px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin:6px 0 14px}
label{font-weight:700;font-size:.9rem}.steps{list-style:none;padding:0;margin:24px 0}
.steps li{display:flex;gap:14px;padding:0 0 26px 0;position:relative;color:var(--mut)}
.steps li:before{content:"";width:18px;height:18px;border-radius:50%;background:var(--line);flex:none;margin-top:4px;z-index:1}
.steps li:after{content:"";position:absolute;left:8px;top:22px;bottom:-4px;width:2px;background:var(--line)}.steps li:last-child:after{display:none}
.steps li.done{color:var(--ink)}.steps li.done:before{background:var(--mint)}.steps li.now:before{background:var(--sun);box-shadow:0 0 0 5px #CE373E55}.steps li.now{color:var(--ink);font-weight:700}
.line{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tag{display:inline-block;background:var(--sun);color:#fff;font-weight:700;font-size:.8rem;padding:3px 12px;border-radius:99px}
.qty button{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);background:none;color:var(--ink);cursor:pointer}
footer{border-top:1px solid var(--line);padding:36px 0;color:var(--mut);font-size:.9rem}
@media(max-width:820px){.hero,.two{grid-template-columns:1fr}.live{box-shadow:6px 6px 0 var(--sun)}}
nav{position:relative}.mb{margin-left:auto;width:46px;height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}.mp{position:absolute;right:0;top:64px;z-index:20;width:min(300px,calc(100vw - 40px));background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px;box-shadow:0 18px 40px #0003;display:flex;flex-direction:column;gap:2px}.mp[hidden]{display:none}.mp a.l{padding:12px 16px;border-radius:12px;font-weight:600;font-size:1rem}.hwc{background:#16224A;color:#fff;border-radius:24px;padding:22px;margin-top:18px}.hwc small{opacity:.7;letter-spacing:.06em}.hwid{font:800 1.7rem "Bricolage Grotesque",Georgia,sans-serif;color:#4ade80;margin:2px 0}.hwb{display:inline-block;margin:8px 8px 0 0;padding:6px 14px;border-radius:99px;background:#2D944533;color:#6ee7a0;font-weight:700;font-size:.85rem;border:1px solid #2D9445}.hwb.c{background:#CE373E33;color:#ff9a9e;border-color:#CE373E}.hwbar{display:flex;gap:4px;margin:16px 0}.hwbar i{flex:1;height:6px;border-radius:4px;background:#ffffff26}.hwbar i.f{background:#2D9445}.hwd{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 14px;border-top:1px solid #ffffff22;padding-top:14px}.hwd small{display:block}.hwc a{color:#fff;font-weight:700}footer.ft{background:#16224A;color:#e8ebf8;border-top:0;padding:52px 0 26px;font-size:1rem}.ft a{color:#e8ebf8;text-decoration:none}.ft a:hover{text-decoration:underline}.ft h4{font:800 1.15rem 'Bricolage Grotesque',Georgia,sans-serif;color:#fff;margin-bottom:16px}.ft ul{list-style:none;padding:0;display:grid;gap:13px}.ft .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:38px}.ft .fine{border-top:1px solid #ffffff26;margin-top:38px;padding-top:18px;font-size:.85rem;color:#b9c0e0}
.legal h1{font-size:clamp(2rem,5vw,3rem)}.legal h3{font-size:1.2rem;margin:30px 0 8px}.legal p,.legal li{color:var(--mut);margin-bottom:10px}.legal ul{padding-left:22px}.legal a{color:var(--blue);font-weight:600}.legal .lm{font-size:.85rem;margin:8px 0 6px}.thumbs{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0}.th{position:relative;width:80px;height:80px}.th img{width:80px;height:80px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}.th button{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border:0;border-radius:50%;background:var(--sun);color:#fff;cursor:pointer}</style></head><body>

const termsPage=()=>legal('Terms of Use',`<h3>1. Using Errand Boys</h3><p>These terms apply when you use this website or ask Errand Boys to run an errand for you. By sending a request or paying a quote, you agree to them. If you do not agree, please do not use the service.</p>
<h3>2. What we do</h3><p>Errand Boys connects you with agents who carry out errands for you, such as grocery shopping, pharmacy pickups, office errands, moving, house hunting, errand verification, car servicing and custom errands. The services shown on the site are examples. Availability depends on your location, the task and the time.</p>

<h3>4. Your responsibilities</h3><p>Give accurate details (the task, addresses, your phone number and the time). Be reachable while the errand is in progress, and treat our agents with respect. We may stop an errand if the details are wrong or an agent would not be safe.</p>
<h3>5. Errands we will not do</h3><ul><li>Anything illegal or against Nigerian law.</li><li>Weapons, illegal drugs, or controlled medicines without a valid prescription.</li><li>Tasks meant to harass, stalk or harm someone.</li><li>Anything that puts an agent at unreasonable risk.</li></ul><p>We may refuse or cancel any errand. Refunds are covered in our <a href="#/refunds">Refund Policy</a>.</p>
<h3>6. Timing</h3><p>Times we give are estimates, not guarantees. Traffic, weather, queues and other things outside our control can cause delays. We will keep you updated.</p>
<h3>7. Verification and house-hunting reports</h3><p>For errand verification and house hunting, agents report what they see and photograph during their visit. A report is not legal advice, a valuation, or a guarantee that a seller, property or document is genuine. Please do not rely on it as your only check before making a large payment.</p>

<h3>9. Your information</h3><p>How we handle your information is explained in our <a href="#/privacy">Privacy Policy</a>.</p>

const privacyPage=()=>legal('Privacy Policy',`<p>This policy explains what personal information Errand Boys collects, why, and the choices you have. We aim to handle personal data in line with the Nigeria Data Protection Act 2023.</p>
<h3>1. What we collect</h3><ul><li><b>Request details:</b> your name, phone number, email (if you give one), addresses, the task, and your preferred time.</li><li><b>Payment details:</b> confirmation that you paid, the amount and a payment reference. Payments are handled by our payment provider, and we do not store your card number.</li><li><b>Messages:</b> what you send us on WhatsApp, email or phone.</li><li><b>Prescriptions:</b> if you upload a prescription or doctor's order for a pharmacy pickup, we use it only to buy and deliver your medicine, share it only with the agent and pharmacy that need it, and keep it only as long as needed.</li><li><b>Proof of work:</b> notes and photos our agents add when they complete an errand.</li><li><b>On your device:</b> this site saves your Errand ID and request details in your browser so checkout can fill them in for you. You can clear them any time in your browser settings.</li></ul>

<h3>3. Who we share it with</h3><ul><li><b>Agents</b> get what they need to do your errand: the task, locations, time and how to reach you.</li><li><b>Service providers</b> that help us run Errand Boys, such as payment, messaging and hosting providers.</li><li><b>Authorities</b>, when the law requires it.</li></ul><p>We do not sell your personal information.</p>
<h3>4. How long we keep it</h3><p>We keep information only as long as we need it to provide the service, resolve disputes and meet legal and accounting duties. After that we delete it or make it anonymous.</p>
<h3>5. Keeping it safe</h3><p>We use reasonable technical and organisational measures to protect your information. No system is perfectly secure, so please keep your Errand ID private.</p>
<h3>6. Your rights</h3><p>You can ask us to see, correct or delete your information, to limit how we use it, or to object to certain uses. Contact us using the details below. You also have the right to complain to the Nigeria Data Protection Commission.</p>
<h3>7. Children</h3><p>Errand Boys is not meant for people under 18, and we do not knowingly collect their information.</p>
<h3>8. Changes</h3><p>We may update this policy. The date at the top shows the latest version.</p>
<h3>9. Contact</h3><p>Email <a href="mailto:${EM}">${EM}</a> or call ${PHD}.</p>`);
const refundPage=()=>legal('Refund Policy',`<p>We want you to be happy with every errand. This policy explains when you can get your money back. Please contact us with your Errand ID so we can help quickly.</p>

<section class="band"><div class="wrap"><h2>How it works</h2><div class="grid"><div class="card"><h3>1. Request</h3><p>Pick a service and describe the task, location and time.</p></div><div class="card"><h3>2. Quote</h3><p>We review it and confirm your price.</p></div><div class="card"><h3>3. Pay</h3><p>Confirm and pay with the payment link.</p></div><div class="card"><h3>4. Done</h3><p>An agent completes it. You follow each status.</p></div></div></div></section>
<section><div class="wrap"><h2>Our services</h2>${'<div class="grid">'+[1,5,2,3].map(i=>S.find(x=>x.id==i)).map(card).join('')+'</div>'}<div class="row" style="margin-top:28px"><a class="btn" href="#/services">See all services</a></div></div></section>
<section class="band"><div class="wrap" style="max-width:820px"><h2>Your Time Matters. We’ll Handle the Rest.</h2><p style="margin-top:20px;font-size:1.1rem">Life and business move fast. From grocery shopping and personal errands to business procurement, pickups, deliveries, and everyday tasks, ERRANDBOYS is your trusted partner for getting things done. We provide reliable, professional, and technology-enabled errand and concierge services designed to save you time… <a href="#/about" style="color:#fff;font-weight:700;text-decoration:underline;white-space:nowrap">Read more about us →</a></p><div style="margin-top:32px;padding-top:24px;border-top:1px solid #ffffff33"><p style="font-size:1.05rem">Have a question or want to know more?</p><a class="btn sun" style="margin-top:12px" href="#/contact">Contact us</a></div></div></section>
${FEATURES}
<section><div class="wrap" style="max-width:640px"><div class="card" style="padding:26px"><div style="display:flex;align-items:center;gap:12px"><img class="lg2" alt="" style="height:44px;width:auto;background:var(--lb);border-radius:10px;padding:2px 4px"><div><h2 style="font-size:1.6rem">Track your errand</h2><span class="tag">Errand Boys</span></div></div><p style="color:var(--mut)">Enter your Errand ID to see where your errand is.</p><label for="hw_in">Errand ID</label><input id="hw_in" placeholder="EB-001245" autocomplete="off" onkeydown="if(event.key===\'Enter\')hw()"><div class="row"><button class="btn" onclick="hw()">Track errand</button><button class="btn out" onclick="hw(\'EB-001245\')">Try sample: EB-001245</button></div><div id="hw_res" aria-live="polite"></div></div></div></section>`,
'/services':()=>`<section><div class="wrap"><h2>Services</h2><p style="color:var(--mut);margin-top:12px">Each request is reviewed and quoted before you pay.</p><div class="grid">${S.map(card).join('')}</div></div></section>`,
'/request':()=>`<section><div class="wrap two" style="align-items:start"><div><h2>Request an errand</h2><p style="color:var(--mut);margin:12px 0">Tell us the details. We get back to you with a price. You only pay once you confirm.</p></div>${form(new URLSearchParams(location.hash.split('?')[1]||'').get('s')||1)}</div></section>`,
'/verify':()=>`<section><div class="wrap two" style="align-items:start"><div><h2>Verify an errand</h2><p style="color:var(--mut);margin:12px 0">Not sure a seller, property or address is real? An agent visits and sends you evidence and a report.</p></div>${form(6,1)}</div></section>`,
'/live':()=>`<section><div class="wrap"><h2>Talk to a live agent</h2><div class="grid"><div class="card"><div class="ic">💬</div><h3>WhatsApp</h3><p>Chat with us now.</p><a class="btn" target="_blank" rel="noopener" href="${wa('Hello Errand Boys, I need help.')}">Open WhatsApp</a></div><div class="card"><div class="ic">📞</div><h3>Call us</h3><p>${PHD}</p>${PH?`<a class="btn" href="tel:${PH}">Call now</a>`:''}</div><div class="card"><div class="ic">↩️</div><h3>Request a callback</h3><label for="cn">Name</label><input id="cn"><label for="cp">Phone</label><input id="cp" type="tel"><a class="btn sun" target="_blank" rel="noopener" href="#" onclick="this.href=wa('Please call me back. Name: '+$('#cn').value+', Phone: '+$('#cp').value)">Ask for callback</a></div></div></div></section>`,
'/track':()=>`<section><div class="wrap two"><div><h2>Track your errand</h2><p style="color:var(--mut);margin:12px 0 20px">Enter your Errand ID, for example EB-K7M2QX.</p><label for="tc">Errand ID</label><input id="tc" placeholder="EB-K7M2QX"><button class="btn" onclick="track()">Track errand</button></div><div class="card" id="res"><p>Your errand status appears here.</p></div></div></section>`,
'/about':()=>`<section class="band"><div class="wrap" style="max-width:820px"><h2>Your Time Matters. We’ll Handle the Rest.</h2><p style="margin-top:20px;font-size:1.1rem">Life and business move fast. From grocery shopping and personal errands to business procurement, pickups, deliveries, and everyday tasks, ERRANDBOYS is your trusted partner for getting things done.</p><p style="margin-top:16px;font-size:1.1rem">We provide reliable, professional, and technology-enabled errand and concierge services designed to save you time, reduce stress, and make everyday life more convenient.</p><p style="margin-top:24px;font:800 1.5rem 'Bricolage Grotesque',Georgia,sans-serif">You have things to do. Let us handle the errands!</p><p style="margin-top:28px;font-weight:800;letter-spacing:.12em">ERRANDBOYS</p><p style="opacity:.85">Saving Time. Delivering Convenience. Building Trust.</p></div></section><section><div class="wrap two"><div><h2>About Errand Boys</h2><p style="color:var(--mut);margin-top:16px">Our promise is simple: tell Errand Boys what you need done, and we'll find someone to do it. Every request is reviewed, priced clearly and handled by an assigned agent, with status updates until it is complete.</p></div><div class="grid" style="margin:0"><div class="card"><h3>Clear pricing</h3><p>You confirm the quote before you pay.</p></div><div class="card"><h3>Assigned agent</h3><p>You know who is handling your errand.</p></div><div class="card"><h3>Status updates</h3><p>Follow progress with your Errand ID.</p></div></div></div></section>${FEATURES}`,
'/contact':()=>`<section><div class="wrap two"><div><h2>Contact us</h2><p style="margin-top:16px">📞 <a href="tel:${PH}">${PHD}</a><br>💬 WhatsApp: ${PHD}<br>✉️ <a href="mailto:${EM}">${EM}</a><br>Social: coming soon</p></div><div class="card"><h3>Prefer WhatsApp?</h3><p>Message us and we will respond as soon as we can.</p><a class="btn" target="_blank" rel="noopener" href="${wa('Hello Errand Boys')}">Open WhatsApp</a></div></div></section>${mapSection()}${deliveredSection()}`};
function route(){const h=(location.hash.slice(1)||'/').split('?')[0];$('#app').innerHTML=(P[h]||P['/'])();document.querySelectorAll('nav a.l').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+h||(h==='/service'&&a.getAttribute('href')==='#/services')));document.querySelectorAll('.lg2').forEach(i=>i.src=document.querySelector('.logo img').src);if(h==='/track'){const q=new URLSearchParams(location.hash.split('?')[1]||'').get('id');if(q){$('#tc').value=q;track()}}scrollTo(0,0)}
function tm(f){const p=$('#mp'),o=f===undefined?p.hidden:f;p.hidden=!o;$('#mb').setAttribute('aria-expanded',o);$('#mb').setAttribute('aria-label',o?'Close menu':'Open menu')}
addEventListener('click',e=>{if(!e.target.closest('nav')||e.target.closest('#mp a'))tm(false)});addEventListener('keydown',e=>e.key==='Escape'&&tm(false));
$('#ft').innerHTML=footerHtml();
addEventListener('hashchange',route);route();
</script></body></html>
